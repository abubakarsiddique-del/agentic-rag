services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      APP_ENV: production
      RAG_COOKIE_SECURE: "1"
      FRONTEND_ORIGIN: "${FRONTEND_ORIGIN:-http://localhost:5191}"
    ports:
      - "${BACKEND_PORT:-18005}:8000"
    volumes:
      - rag_history:/var/lib/agentic-rag/db
      - hf_cache:/home/app/.cache/huggingface
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5191}:80"
    restart: unless-stopped

volumes:
  rag_history:
  hf_cache:
